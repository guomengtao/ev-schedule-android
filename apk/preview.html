<style>
  :root{
    --bg:#0B1020; --card:#151C30; --card2:#1C2542; --line:#27314C;
    --text:#E9EEF9; --muted:#8695B4; --accent:#4C8DFF;
    --ok:#34C759; --warn:#FFB020; --err:#FF6B6B;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;gap:26px;flex-wrap:wrap;padding:26px;
       background:radial-gradient(1100px 600px at 20% 0%,#141C33 0%,#070A12 62%);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
  .side{max-width:430px}
  .side h1{font-size:20px;margin:0 0 6px}
  .side .logo{width:36px;height:36px;vertical-align:middle;margin-right:8px;border-radius:6px}
  .sub{color:var(--muted);font-size:13px;line-height:1.75}
  .badge{display:inline-block;margin:10px 0 12px;padding:4px 10px;border-radius:999px;font-size:12px;
         background:rgba(255,176,32,.12);color:var(--warn);border:1px solid rgba(255,176,32,.35)}
  .kv{font-size:12.5px;line-height:1.9;color:var(--muted)}
  .kv b{color:var(--text)}
  code{font-family:ui-monospace,Menlo,monospace;background:#1D2540;border:1px solid var(--line);
       padding:1px 6px;border-radius:5px;font-size:11.5px;color:#CFD8EC}
  .phone{width:390px;height:780px;background:#000;border-radius:38px;padding:10px;
         box-shadow:0 30px 80px rgba(0,0,0,.62), inset 0 0 0 1px #2A3350}
  .screen{width:100%;height:100%;background:var(--bg);border-radius:30px;overflow:hidden;
          display:flex;flex-direction:column}
  .statusbar{height:26px;flex:0 0 26px;display:flex;align-items:center;justify-content:space-between;
             padding:0 16px;font-size:11px;color:var(--muted);background:#080C16}
  .statusbar img{width:14px;height:14px;margin-right:5px;vertical-align:middle;border-radius:3px}
  .install-card{border-left:3px solid var(--accent)}
  .install-card .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600}
  .install-card .tag.rec{background:rgba(76,141,255,.18);color:var(--accent)}
  .install-card .tag.bak{background:rgba(255,176,32,.18);color:var(--warn)}
  .install-card a{color:var(--accent);text-decoration:none;font-size:11px}
  .install-card a:hover{text-decoration:underline}
  .app{flex:1;display:flex;flex-direction:column;padding:14px;min-height:0;overflow:auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;margin-bottom:10px}
  .card2{background:var(--card2)}
  .h1{font-size:19px;font-weight:700}
  .h2{font-size:22px;font-weight:700}
  .sub2{font-size:12px;color:var(--muted)}
  .step{font-size:12px;padding:3px 0;color:var(--muted)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button{appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--text);
         border-radius:12px;padding:11px 8px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
  button:hover{border-color:#3A4A72;background:#212C4C}
  button:active{transform:scale(.98)}
  button.pri{background:var(--accent);border-color:#3E7AE0;font-weight:600;color:#fff}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tabs button{font-size:11.5px;padding:7px 9px;border-radius:10px}
  .tabs button.on{background:var(--accent);border-color:#3E7AE0;color:#fff;font-weight:600}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--muted);
        white-space:pre-wrap;word-break:break-all}
  .g{color:var(--ok)} .r{color:var(--err)} .b{color:var(--accent)} .w{color:var(--warn)}
  @media (max-width:900px){.phone{width:100%;max-width:390px;height:720px}}
</style>
</head>

        <button onclick="show('fail',this)">首页·失败</button>
        <button onclick="show('debug',this)">调试页</button>
        <button onclick="show('install',this)">安装指南</button>
      </div>
      <div id="view"></div>
    </div>
  </div>
</div>

<script>
var V = document.getElementById('view');
var timer = null;

function card(inner, cls){ return '<div class="card '+(cls||'')+'">'+inner+'</div>'; }

function steps(states, details){
  var labels = ["初始化穿戴服务","查找已连接设备","申请设备权限","连接 EV 课程表"];
  var out = '';
  for (var i=0;i<4;i++){
    var st = states[i], mark = '○', col = 'var(--muted)';
    if (st===2){ mark='✓'; col='var(--ok)'; }
    else if (st===1){ mark='◐'; col='var(--accent)'; }
    else if (st===3){ mark='✕'; col='var(--err)'; }
    var d = details[i] ? '   — '+details[i] : '';
    out += '<div class="step" style="color:'+col+'">'+(i+1)+'. '+mark+'  '+labels[i]+d+'</div>';
  }
  return out;
}

function actions(){
  return '<div class="grid">'
    + '<button class="pri">导入课程表</button>'
    + '<button class="pri">导出课程表</button>'
    + '<button>设置（昵称）</button>'
    + '<button>调试</button></div>';
}

var views = {};

views.connecting = function(){
  var s = [2,1,0,0], d = ["穿戴服务可用","正在查找…","",""];
  var left = 2, t = 0;
  V.innerHTML =
      '<div class="h1">EV 课程表</div><div class="sub2">安卓同步器</div><br>'
    + card('<div class="h2">欢迎！</div><div class="sub2">正在连接手环…</div>')
    + card('<div class="b" style="font-weight:600;font-size:12px" id="est">预计还需 ~2 秒</div><br>' + steps(s,d));
  clearInterval(timer);
  timer = setInterval(function(){
    t++;
    if (t===1){ s=[2,2,1,0]; d=["穿戴服务可用","小米手环10 Pro","正在申请…",""]; left=2; }
    if (t===3){ s=[2,2,2,1]; d=["穿戴服务可用","小米手环10 Pro","已授权","正在唤醒 EV…"]; left=1; }
    if (t===5){ s=[2,2,2,2]; d=["穿戴服务可用","小米手环10 Pro","已授权","1.6.103 (code 932)"]; left=0; }
    V.innerHTML =
        '<div class="h1">EV 课程表</div><div class="sub2">安卓同步器</div><br>'
      + card('<div class="h2">欢迎！</div><div class="sub2">'
          + (left===0 ? '已连接，正在读取资料…' : '正在连接手环…') + '</div>')
      + card('<div class="'+(left===0?'g':'b')+'" style="font-weight:600;font-size:12px">'
          + (left===0 ? '马上就好…' : '预计还需 ~'+left+' 秒') + '</div><br>' + steps(s,d));
    if (t>5) clearInterval(timer);
  }, 900);
};

views.done = function(){
  clearInterval(timer);
  V.innerHTML =
      '<div class="h1">EV 课程表</div><div class="sub2">安卓同步器</div><br>'
    + card('<div class="h2">欢迎，123！</div>'
          + '<div class="sub2 g">已连接 小米手环10 Pro · EV 1.6.103 (code 932) · 课表 21 节</div>')
    + card('<div class="g" style="font-weight:600;font-size:12px">连接完成</div><br>'
          + steps([2,2,2,2],["穿戴服务可用","小米手环10 Pro","已授权","1.6.103 (code 932)"]))
    + actions()
    + '<div class="mono" style="margin-top:8px">包名 com.application.watch.classschedule · v0.5.0</div>';
};

views.fail = function(){
  clearInterval(timer);
  V.innerHTML =
      '<div class="h1">EV 课程表</div><div class="sub2">安卓同步器</div><br>'
    + card('<div class="h2">欢迎！</div><div class="sub2 r">未连接</div>')
    + card('<div class="r" style="font-weight:600;font-size:12px">连接未完成</div><br>'
          + steps([2,2,2,3],["穿戴服务可用","小米手环10 Pro","已授权","无回应"]))
    + card('<div class="w" style="font-size:13px">请先在手表上打开一次「EV 课程表」，然后回到本页重试</div><br>'
          + '<div class="grid"><button class="pri">重试连接</button>'
          + '<button>打开手环 EV</button></div>')
    + actions();
};

views.debug = function(){
  clearInterval(timer);
  var rows = [
    ["1 初始化穿戴服务","检测小米穿戴服务是否可用 · ✓ 服务可用 (level 1)", 'g'],
    ["2 查找已连接设备","拿到 nodeId · ✓ 小米手环10 Pro  nodeId=2137618976", 'g'],
    ["3 申请设备权限","DEVICE_MANAGER + NOTIFY · ✓ 已授权", 'g'],
    ["4 连接 EV 课程表","ping 手环上的 EV · ✓ pong 1.6.103", 'g']
  ];
  var list = '';
  for (var i=0;i<rows.length;i++){
    list += '<div class="card card2" style="padding:12px 10px;margin-bottom:6px">'
         + '<div style="font-size:13.5px;font-weight:600;color:var(--'+rows[i][2]+')">✓ '+rows[i][0]+'</div>'
         + '<div class="sub2" style="margin-top:2px">'+rows[i][1]+'</div></div>';
  }
  V.innerHTML =
      '<div class="h1">调试</div><div class="sub2">按顺序点击任一步骤，逐步定位问题</div><br>'
    + list
    + '<div class="grid"><button class="pri">全部执行</button><button>重置状态</button>'
    + '<button>EV 是否安装</button><button>拉起手环 EV</button>'
    + '<button>手表通知(验下行)</button><button>清屏</button></div>'
    + '<div class="card" style="margin-top:8px"><div class="mono">{"action":"ping"}</div></div>'
    + '<button class="pri" style="width:100%">发送自定义 JSON</button>'
    + '<div class="card" style="margin-top:8px"><div class="mono">20:42:08.457 &lt;&lt; RX #1 len=81\n'
    + '{"ok":true,"action":"ping","pong":true,\n "versionName":"1.6.103","versionCode":932}</div></div>';
};

views.install = function(){
  clearInterval(timer);
  V.innerHTML =
      '<div class="h1">安装指南</div><div class="sub2">在手环上安装 EV 课程表快应用</div><br>'
    + card('<span class="tag rec">推荐</span> <b style="font-size:14px">方式一：Deck 安装版</b>'
          + '<div class="sub2" style="margin-top:6px">手机浏览器打开链接，一键安装到手环，最简单</div>'
          + '<div class="mono" style="margin-top:4px">deck.azki.ai</div>'
          + '<div style="margin-top:8px"><a href="https://deck.azki.ai" target="_blank">打开 Deck →</a></div>'
          , 'install-card')
    + card('<span class="tag bak">备选</span> <b style="font-size:14px">方式二：Astrobox + RPK 包</b>'
          + '<div class="sub2" style="margin-top:6px">如果 Deck 方式不合适，可使用 Astrobox 安装 RPK 包</div>'
          + '<div style="margin-top:6px;font-size:11px;color:var(--muted)">'
          + '① <a href="https://app-auth.gudq.com/user-guide.html" target="_blank">Astrobox 使用指南 →</a></div>'
          + '<div style="font-size:11px;color:var(--muted)">'
          + '② <a href="https://www.bandbbs.cn/resources/authors/4611408/" target="_blank">下载 RPK 安装包 →</a></div>'
          , 'install-card')
    + card('<div style="font-size:11px;color:var(--muted);text-align:center">'
          + '两种方式互补，总有一种适合你 ✨</div>');
};

function show(k, btn){
  var bs = document.querySelectorAll('.tabs button');
  for (var i=0;i<bs.length;i++){ bs[i].className = ''; }
  if (btn) btn.className = 'on';
  views[k]();
}
show('connecting', document.querySelector('.tabs button'));
</script>
</body>
</html>
